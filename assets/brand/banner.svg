<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Dodging Infinity</title>
  <desc id="desc">Dodging Infinity — Bounding the infinite to the finite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360">
      <stop offset="0" stop-color="#080B11"/>
      <stop offset="1" stop-color="#101526"/>
    </linearGradient>
    <linearGradient id="signal" x1="85" y1="90" x2="340" y2="250">
      <stop offset="0" stop-color="#45E6FF"/>
      <stop offset="1" stop-color="#A56CFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="36" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="35" fill="none" stroke="#28324A" stroke-width="2"/>

  <path d="M84 180 C84 125 139 100 180 142 L237 218 C270 260 332 236 332 180 C332 124 270 100 237 142 L180 218 C139 260 84 235 84 180"
        fill="none" stroke="#526078" stroke-opacity=".22" stroke-width="22" stroke-linecap="round"/>
  <path d="M84 180 C84 125 139 100 180 142 L215 180 L180 218 C139 260 84 235 84 180"
        fill="none" stroke="url(#signal)" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M241 90 V154 M241 206 V270" stroke="#8490A8" stroke-width="7" stroke-linecap="round"/>
  <path d="M215 180 H279 M279 180 L318 138 M279 180 H329 M279 180 L318 222"
        fill="none" stroke="url(#signal)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="323" cy="133" r="13" fill="#0B0E14" stroke="#8D7CFF" stroke-width="8"/>
  <circle cx="336" cy="180" r="13" fill="#0B0E14" stroke="#956FFF" stroke-width="8"/>
  <circle cx="323" cy="227" r="13" fill="#0B0E14" stroke="#A56CFF" stroke-width="8"/>

  <text x="420" y="145" fill="#F5F7FF" font-size="62" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, sans-serif" letter-spacing="-2">Dodging Infinity</text>
  <text x="423" y="198" fill="#AEB8CC" font-size="26" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Bounding the infinite to the finite.</text>
  <text x="423" y="252" fill="#65718A" font-size="15" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif" letter-spacing="2">DECOMPOSE  ·  ISOLATE  ·  SOLVE  ·  CHALLENGE  ·  VALIDATE  ·  COMPOSE</text>
</svg>
