<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="di-title di-desc">
  <title id="di-title">Dodging Infinity</title>
  <desc id="di-desc">An unbounded path runs through three control gates, marked at each checkpoint and brightening from graphite into vivid green as it passes. Wordmark: Dodging Infinity — AI orchestration and mission control for agents.</desc>

  <defs>
    <linearGradient id="di-bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0D0C"/>
      <stop offset="0.55" stop-color="#0D1211"/>
      <stop offset="1" stop-color="#121816"/>
    </linearGradient>

    <linearGradient id="di-flow" x1="140" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A6771"/>
      <stop offset="0.30" stop-color="#7E8D96"/>
      <stop offset="0.50" stop-color="#95AC62"/>
      <stop offset="0.72" stop-color="#B4E832"/>
      <stop offset="1" stop-color="#C9FF3D"/>
    </linearGradient>

    <radialGradient id="di-halo" cx="510" cy="250" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9FF3D" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C9FF3D" stop-opacity="0"/>
    </radialGradient>

    <filter id="di-soft" x="-25%" y="-45%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="500" rx="28" fill="url(#di-bg)"/>
  <rect x="1" y="1" width="1598" height="498" rx="27" fill="none" stroke="#1D2522" stroke-width="2"/>
  <rect x="210" y="20" width="600" height="460" fill="url(#di-halo)"/>

  <!-- Control gates: finite checkpoints standing across an unbounded path. -->
  <g fill="#1E2825" stroke="#57665F" stroke-width="2.5">
    <rect x="272" y="104" width="16" height="292" rx="8"/>
    <rect x="362" y="104" width="16" height="292" rx="8"/>
    <rect x="452" y="104" width="16" height="292" rx="8"/>
  </g>

  <!-- Bounded channel: the path is contained, not trapped. -->
  <path d="M370 250 C462 74 600 74 600 250 C600 426 462 426 370 250 C278 74 140 74 140 250 C140 426 278 426 370 250 Z"
        fill="none" stroke="#1B2321" stroke-width="27" stroke-linejoin="round"/>
  <path d="M370 250 C462 74 600 74 600 250 C600 426 462 426 370 250 C278 74 140 74 140 250 C140 426 278 426 370 250 Z"
        fill="none" stroke="url(#di-flow)" stroke-width="13" stroke-linejoin="round" opacity="0.3" filter="url(#di-soft)"/>
  <path d="M370 250 C462 74 600 74 600 250 C600 426 462 426 370 250 C278 74 140 74 140 250 C140 426 278 426 370 250 Z"
        fill="none" stroke="url(#di-flow)" stroke-width="13" stroke-linejoin="round"/>

  <!-- Checkpoints: where the path is inspected at each gate. -->
  <g stroke="#0F1614" stroke-width="2.5">
    <rect x="274" y="133.3" width="12" height="12" rx="2.5" fill="#CBD8DE"/>
    <rect x="274" y="354.7" width="12" height="12" rx="2.5" fill="#CBD8DE"/>
    <rect x="454" y="133.3" width="12" height="12" rx="2.5" fill="#C9FF3D"/>
    <rect x="454" y="354.7" width="12" height="12" rx="2.5" fill="#C9FF3D"/>
  </g>
  <rect x="360" y="240" width="20" height="20" rx="4" fill="#C9FF3D" stroke="#0F1614" stroke-width="2.5"/>

  <path d="M690 168 V332" stroke="#212A28" stroke-width="2"/>

  <rect x="720" y="182" width="72" height="4" rx="2" fill="#C9FF3D"/>
  <text x="720" y="266" fill="#F2F6F0" font-size="70" font-weight="700" letter-spacing="4"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">DODGING INFINITY</text>
  <text x="722" y="324" fill="#93A0A8" font-size="27"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">AI orchestration &amp; mission control for agents</text>
</svg>
