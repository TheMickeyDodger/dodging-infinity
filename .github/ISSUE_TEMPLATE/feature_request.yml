name: Feature request
description: Propose a new capability or architectural improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Dodging Infinity grows by turning broad ideas into bounded, testable changes.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the problem independently of your preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain the capability or architectural change you have in mind.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and validation
      description: How should the work be scoped, isolated, and verified?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
