name: Pixel validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The UI suite (webview-ui, ~55 min serial) runs as four parallel shards balanced by measured
# per-file time (integrations/pixel-agents/scripts/pixel-ui-shards.mjs). Files stay serial inside
# each shard (fileParallelism: false), so screenshot timing is unchanged. Types, lint, builds and the
# server/package tests run once in "Pixel checks". The required status check is the final
# "Pixel validation" job, which passes only when every job above it passed.
#
# A docs/README-only change skips the UI shards. The validation job still runs and exits
# success, so the required "Pixel validation" check does not stay pending. Each UI shard
# retries once, and only once, after a failure. The retry line is in the log.

env:
  HUSKY: "0"
  SCARF_ANALYTICS: "false"
  DO_NOT_TRACK: "1"
  CI: "true"
  PIXEL_UI_SHARDS: "4"

jobs:
  path-filter:
    name: Pixel path filter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ui: ${{ steps.filter.outputs.pixel_ui }}
      reason: ${{ steps.filter.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the Pixel UI suite runs
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/ci_path_filter.py

  pixel-checks:
    name: Pixel checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: integrations/pixel-agents
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.5.0"
          cache: npm
          cache-dependency-path: integrations/pixel-agents/package-lock.json

      - name: Install locked dependencies and preserve Git hooks
        shell: bash
        run: |
          git config --get core.hooksPath > "$RUNNER_TEMP/pixel-hooks-before" || test "$?" -eq 1
          npm ci --foreground-scripts --no-audit --no-fund --no-update-notifier
          git config --get core.hooksPath > "$RUNNER_TEMP/pixel-hooks-after" || test "$?" -eq 1
          diff -u "$RUNNER_TEMP/pixel-hooks-before" "$RUNNER_TEMP/pixel-hooks-after"
          git diff --exit-code -- package-lock.json

      - name: Prove the UI test shards cover every file exactly once
        run: node scripts/pixel-ui-shards.mjs --check --of "$PIXEL_UI_SHARDS"

      - name: Generate and validate AsyncAPI messages
        run: |
          npm run asyncapi:generate
          npm run asyncapi:validate

      - name: Check types
        run: npm run check-types

      - name: Lint server and UI
        run: npm run lint

      - name: Build production bundles
        run: |
          npm run build:extension
          npm run build:webview

      - name: Run server tests
        run: npm run test:server

      - name: Check package contracts and asset budgets
        run: npm run test:package-contract

      - name: Assemble the standalone DI package
        run: node scripts/build-di-package.mjs --out "$RUNNER_TEMP/pixel-agents-di-package"

  pixel-ui-tests:
    name: Pixel UI tests (${{ matrix.shard }}/4)
    needs: [path-filter]
    if: needs.path-filter.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: integrations/pixel-agents
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.5.0"
          cache: npm
          cache-dependency-path: integrations/pixel-agents/package-lock.json

      - name: Install locked dependencies and preserve Git hooks
        shell: bash
        run: |
          git config --get core.hooksPath > "$RUNNER_TEMP/pixel-hooks-before" || test "$?" -eq 1
          npm ci --foreground-scripts --no-audit --no-fund --no-update-notifier
          git config --get core.hooksPath > "$RUNNER_TEMP/pixel-hooks-after" || test "$?" -eq 1
          diff -u "$RUNNER_TEMP/pixel-hooks-before" "$RUNNER_TEMP/pixel-hooks-after"
          git diff --exit-code -- package-lock.json

      - name: Run UI tests (shard ${{ matrix.shard }}/4)
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t files < <(node scripts/pixel-ui-shards.mjs --shard "$SHARD" --of "$PIXEL_UI_SHARDS")
          test "${#files[@]}" -gt 0
          printf 'shard %s/%s runs %s files\n' "$SHARD" "$PIXEL_UI_SHARDS" "${#files[@]}"
          cd webview-ui
          # One retry for this browser shard, and only in CI. A second failure
          # is the result. The log says which run it was.
          set +e
          npm test -- "${files[@]}"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Pixel UI retry::shard ${SHARD}/${PIXEL_UI_SHARDS} failed once (exit ${code}). Retrying this browser shard once."
            echo "RETRY: Pixel UI shard ${SHARD}/${PIXEL_UI_SHARDS} failed (exit ${code}). Running the same files one more time."
            npm test -- "${files[@]}"
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "::error title=Pixel UI retry::shard ${SHARD}/${PIXEL_UI_SHARDS} failed again after the one CI retry."
              exit "$code"
            fi
            echo "RETRY: Pixel UI shard ${SHARD}/${PIXEL_UI_SHARDS} passed on the second run."
          fi
          exit "$code"

  pixel-validation:
    name: Pixel validation
    if: ${{ always() }}
    needs: [path-filter, pixel-checks, pixel-ui-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Pixel job to pass
        env:
          FILTER: ${{ needs.path-filter.result }}
          REASON: ${{ needs.path-filter.outputs.reason }}
          RUN_UI: ${{ needs.path-filter.outputs.ui }}
          CHECKS: ${{ needs.pixel-checks.result }}
          UI_TESTS: ${{ needs.pixel-ui-tests.result }}
        run: |
          echo "Path filter: $FILTER"
          echo "Reason: $REASON"
          echo "Pixel checks: $CHECKS"
          echo "Pixel UI tests (all shards): $UI_TESTS"
          test "$FILTER" = success
          test "$CHECKS" = success
          if [ "$RUN_UI" != "true" ]; then
            echo "Pixel UI suite skipped: $REASON"
            echo "This gate is success so the required Pixel validation check does not stay pending."
            test "$UI_TESTS" = skipped
            exit 0
          fi
          test "$UI_TESTS" = success
