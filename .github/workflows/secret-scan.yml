name: Secret scan

# Scans every reachable commit (all refs, merge diffs included) for credentials and private keys.
# Findings are reported as rule, path, line and short commit ONLY; the matched value never reaches the log.
# Exceptions live in .gitleaks.toml: individually reviewed synthetic fixtures, each conjunctive on rule, path
# and exact value. There is no baseline and no path-wide or runtime-path allowlist.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (all refs, full history, redacted)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Reviewed release v8.30.1 (tag commit 83d9cd684c87d95d656c1458ef04895a7f1cbd8e). The digest below is for
      # THIS platform's archive (linux_x64), taken from the official release checksums file and cross-checked
      # against the GitHub API asset digest. It is NOT the macOS digest; digests differ per platform.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - name: Check out repository (full history, all branches and tags)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the checkout is not shallow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          echo "reachable commits across all refs: $(git rev-list --all --count)"

      - name: Install pinned Gitleaks (checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          "${RUNNER_TEMP}/gitleaks/gitleaks" version

      - name: Scan all reachable history, including merge diffs
        shell: bash
        run: |
          set -uo pipefail
          report="${RUNNER_TEMP}/gitleaks-report.json"
          log="${RUNNER_TEMP}/gitleaks.log"
          reachable="$(git rev-list --all --count)"
          # "commits scanned" counts commits that yield a fragment under the same
          # `git log -p -U0 --all --full-history -m` walk gitleaks runs. Non-archive
          # binaries, empty commits, and file deletions produce no fragment, so they
          # are absent from that counter (gitleaks itself notes this). The synthetic
          # pull merge ref stays in the count when its patch has a text hunk. Expected
          # is that scannable set, not `git rev-list --all`: a smaller scan still fails.
          expected="$(python3 - <<'PY'
          import subprocess
          import sys

          ARCHIVE_MARKS = (
              ".zip", ".tar", ".gz", ".bz2", ".xz", ".zst", ".rar", ".7z",
              ".br", ".lz4", ".lz", ".sz", ".zz", ".mz",
          )

          def dest_path(header):
              rest = header[len("diff --git "):].strip()

              def take(text):
                  if text.startswith('"'):
                      chars = []
                      i = 1
                      while i < len(text):
                          c = text[i]
                          if c == "\\" and i + 1 < len(text):
                              chars.append(text[i + 1])
                              i += 2
                              continue
                          if c == '"':
                              return "".join(chars), text[i + 1:].lstrip()
                          chars.append(c)
                          i += 1
                      return "".join(chars), ""
                  token, _, tail = text.partition(" ")
                  return token, tail

              _, rest = take(rest)
              new, _ = take(rest)
              return new[2:] if new.startswith("b/") else new

          def is_archive(path):
              name = path.replace("\\", "/").rsplit("/", 1)[-1].lower()
              return any(mark in name for mark in ARCHIVE_MARKS)

          proc = subprocess.Popen(
              ["git", "log", "-p", "-U0", "--all", "--full-history", "-m",
               "--no-color", "--pretty=format:%H"],
              stdout=subprocess.PIPE, text=True, errors="replace",
          )
          sha = None
          counted = set()
          deleted = binary = text = file_open = False
          path = ""

          def flush():
              global deleted, binary, text, file_open, path, sha, counted
              if file_open and sha and not deleted and (text or (binary and is_archive(path))):
                  counted.add(sha)
              file_open = False

          for line in proc.stdout:
              if len(line) >= 41 and line[40] == "\n" and all(c in "0123456789abcdef" for c in line[:40]):
                  flush()
                  sha = line[:40]
                  continue
              if line.startswith("diff --git "):
                  flush()
                  file_open = True
                  deleted = binary = text = False
                  path = dest_path(line)
                  continue
              if not file_open:
                  continue
              if line.startswith("deleted file mode"):
                  deleted = True
              elif line.startswith("Binary files ") or line.startswith("GIT binary patch"):
                  binary = True
              elif line.startswith("@@") and not binary:
                  text = True
          flush()
          if proc.wait() != 0:
              sys.exit(1)
          if not counted:
              sys.exit(1)
          print(len(counted))
          PY
          )" || { echo "::error::Could not count scannable commits. Failing closed."; exit 2; }
          case "${expected}" in
            ''|*[!0-9]*) echo "::error::Scannable commit count is not a number. Failing closed."; exit 2 ;;
          esac
          if [ "${expected}" -le 0 ] || [ "${expected}" -gt "${reachable}" ]; then
            echo "::error::Scannable commit count ${expected} is outside 1..${reachable}. Failing closed."
            exit 2
          fi
          rc=0
          # --all --full-history -m: every ref, every path, and the diff of every merge (a plain --all misses
          # content that exists only in a merge resolution). --redact=100 hides the value; --ignore-gitleaks-allow
          # stops an inline marker from silencing a finding. Scanner output goes to a private file, never the log.
          "${RUNNER_TEMP}/gitleaks/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="--all --full-history -m" \
            --redact=100 \
            --ignore-gitleaks-allow \
            --no-banner \
            --report-format json \
            --report-path "$report" > "$log" 2>&1 || rc=$?
          scanned="$(sed -E 's/\x1b\[[0-9;]*m//g' "$log" | sed -nE 's/.*[^0-9]([0-9]+) commits scanned.*/\1/p' | tail -n1)"
          echo "commits scanned: ${scanned:-unknown} (scannable: ${expected}; reachable across all refs: ${reachable})"
          if [ "${scanned:-}" != "${expected}" ]; then
            echo "::error::Gitleaks did not report scanning every scannable commit (scanned ${scanned:-unknown}, scannable ${expected}, reachable ${reachable}). Failing closed."
            exit 2
          fi
          if [ "$rc" -eq 0 ]; then
            echo "No secrets found."
            exit 0
          fi
          if [ ! -s "$report" ]; then
            echo "::error::Gitleaks exited with status ${rc} without a findings report (scanner error, not a clean result)."
            exit "$rc"
          fi
          python3 - "$report" <<'PY'
          import json
          import sys

          def esc(value, prop=False):
              value = str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return value.replace(":", "%3A").replace(",", "%2C") if prop else value

          findings = json.load(open(sys.argv[1])) or []
          print("Gitleaks reported %d possible secret(s). Values are redacted and are never printed." % len(findings))
          for f in sorted(findings, key=lambda x: (x["File"], x["StartLine"], x["RuleID"], x.get("Commit", ""))):
              print("::error file=%s,line=%s,title=%s::Possible secret (rule %s) in commit %s; value redacted" % (
                  esc(f["File"], True), f["StartLine"], esc("Gitleaks " + f["RuleID"], True),
                  esc(f["RuleID"]), esc((f.get("Commit") or "")[:10])))
              print("  rule=%s path=%s line=%s commit=%s" % (f["RuleID"], f["File"], f["StartLine"], (f.get("Commit") or "")[:10]))
          PY
          exit "$rc"
