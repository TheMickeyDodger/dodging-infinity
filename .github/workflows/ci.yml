name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        run: |
          python --version
          git --version

      - name: Run unit tests
        shell: bash
        run: |
          status=0
          for test_file in tests/test_*.py; do
            if [ "$test_file" = "tests/test_static.py" ]; then
              continue
            fi
            echo "=== $test_file ==="
            PYTHONPATH="$PWD" python "$test_file" || status=$?
          done
          test "$status" -eq 0

      - name: Run static integration suite
        run: PYTHONPATH="$PWD" python tests/test_static.py

      - name: Compile Python sources
        run: python -m py_compile herdctl.py herdr/*.py tests/*.py codexgw.py codex_gateway/*.py tgop.py telegram_operator/*.py workflow_authority/*.py target_runtime/*.py dirun.py operator_session/*.py human_interaction/*.py durable_execution/*.py capability/*.py worker/*.py pr_delivery/*.py

      - name: Check for whitespace errors
        # Against the empty tree, so every tracked file is checked on a
        # clean checkout (a bare `git diff --check` would be vacuous).
        run: git diff --check "$(git hash-object -t tree /dev/null)"
